<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type mix</title>
<style>
@font-face{font-family:"P-Lexend";src:url(fonts/lexend.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"P-Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000}
:root{--sage:#5E7F6B;--cream:#F3EEE1;--ink:#2F4236;--sand:#D9CFB4}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"P-Lexend",sans-serif;width:1400px}
section{padding:30px 56px}
h1{font-size:28px;margin:0 0 8px;font-weight:600}
p.lead{max-width:920px;line-height:1.6;margin:0}
.opt{background:#FBF8F1;border:1px solid #2F423614;border-radius:28px;padding:28px 34px;margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.head b{font-size:20px;font-weight:600}
.head span{font-size:13px;color:#2F4236bf}
.grid{display:grid;grid-template-columns:400px 1fr 330px;gap:30px;align-items:center}
.lock{display:flex;align-items:center;gap:20px}
.lock svg{width:96px;height:96px;flex:none}
.wm{font-size:92px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.site{background:var(--cream);border-radius:22px;padding:20px 24px;border:1px solid #2F423612}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.nav svg{width:34px;height:34px}
.nav .n{font-size:28px;letter-spacing:-.01em}
.nav .links{margin-left:auto;font-size:14px;color:#2F4236bf;display:flex;gap:18px}
.site h3{font-size:34px;line-height:1.12;margin:0 0 10px;font-weight:600}
.site p{margin:0 0 16px;line-height:1.55;font-size:15px;color:#2F4236cc;max-width:440px}
.btn{display:inline-block;background:var(--sage);color:var(--cream);font-weight:600;font-size:17px;border-radius:14px;padding:11px 20px}
.app{background:var(--cream);border-radius:22px;padding:18px 20px;border:1px solid #2F423612}
.app .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.app .top svg{width:24px;height:24px}
.app .top .n{font-size:19px}
.chip{display:inline-block;background:var(--sage);color:var(--cream);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.steps{list-style:none;padding:0;margin:12px 0 0;font-size:14.5px}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0}
.steps i{width:20px;height:20px;border-radius:50%;border:2px solid var(--sage);display:block;flex:none}
.steps i.d{background:var(--sage);position:relative}
.steps i.d::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid var(--cream);border-width:0 2px 2px 0;transform:rotate(45deg)}
</style>
</head>
<body>
<section>
  <h1>Lexend only vs. the mix</h1>
  <p class="lead">Top: option A as it stands, Lexend everywhere. Below: the mix, Nunito for the "plover" name only and Lexend for
  everything else, shown at two weights. All lowercase. Compare the name next to the bird, then check that the rest of the
  page still feels like one family.</p>
</section>
<section id="rows"></section>
<script>
const L = (id) => `<svg viewBox="0 0 256 256"><defs><clipPath id="${id}"><rect width="256" height="256" rx="56"/></clipPath></defs><rect width="256" height="256" rx="56" fill="#5E7F6B"/><g clip-path="url(#${id})"><circle cx="168" cy="226" r="112" fill="#F3EEE1"/><path d="M108 168 Q122 182 136 168" fill="none" stroke="#2F4236" stroke-width="8" stroke-linecap="round"/><path d="M66 178 Q40 186 22 196 Q42 206 68 212 Z" fill="#E3B55B" stroke="#E3B55B" stroke-width="8" stroke-linejoin="round"/><path d="M138 260 C138 236 152 222 164 210 C176 222 190 236 190 260 Z" fill="#D9CFB4" stroke="#F3EEE1" stroke-width="5" stroke-linejoin="round"/></g></svg>`;
const R = [
  ["A · Lexend everywhere (current)", "name: Lexend 600 · text: Lexend", "font-family:'P-Lexend';font-weight:600"],
  ["Mix 1 · Nunito 800 name + Lexend text", "name: Nunito 800 (heavy, round) · text: Lexend", "font-family:'P-Nunito';font-weight:800"],
  ["Mix 2 · Nunito 700 name + Lexend text", "name: Nunito 700 (lighter, calmer) · text: Lexend", "font-family:'P-Nunito';font-weight:700"],
];
document.getElementById('rows').innerHTML = R.map(([t, s, st], i) => `
  <div class="opt"><div class="head"><b>${t}</b><span>${s}</span></div>
  <div class="grid">
    <div class="lock">${L('a' + i)}<div class="wm" style="${st}">plover</div></div>
    <div class="site"><div class="nav">${L('b' + i)}<span class="n" style="${st}">plover</span><div class="links"><span>How it works</span><span>FAQ</span></div></div>
      <h3>One step at a time.</h3><p>A calm little bird that sits at the edge of your screen, breaks your task into steps and keeps you company.</p><span class="btn">Join the waitlist</span></div>
    <div class="app"><div class="top">${L('c' + i)}<span class="n" style="${st}">plover</span></div><span class="chip">Draft the intro · 18:42</span>
      <ul class="steps"><li><i class="d"></i>Reread the essay prompt</li><li><i></i>Write one opening sentence</li><li><i></i>List three points to cover</li></ul></div>
  </div></div>`).join('');
</script>
</body>
</html>
