name: Dependabot Lockfile Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-lockfile:
    name: Fix Lockfile Mismatch
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_LOCKFILE_PAT || github.token }}

      - name: Install libsecret (required by keytar)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Commit and push lockfile changes
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            git config --global user.name "dependabot[bot]"
            git config --global user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm lockfile"
            git push
          else
            echo "No changes in lockfiles detected."
          fi
