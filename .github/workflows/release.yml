name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tag:
    name: Compute tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Generate tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            asset_glob: |
              app/dist/*.dmg
              app/dist/*.dmg.blockmap
          - os: windows-latest
            label: Windows
            asset_glob: |
              app/dist/*.exe
              app/dist/*.exe.blockmap

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package App
        run: pnpm package
        env:
          # Code signing disabled until Apple Developer / Windows codesign certs are wired into CI secrets
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PLOVER_BACKEND_URL: https://plover-server-562340206018.us-central1.run.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plover-${{ matrix.label }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish to Plover-Releases
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mint Plover-Releases token
        id: releases_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PLOVER_RELEASES_APP_ID }}
          private-key: ${{ secrets.PLOVER_RELEASES_APP_PRIVATE_KEY }}
          owner: tryplover
          repositories: Plover-Releases

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          repository: tryplover/Plover-Releases
          token: ${{ steps.releases_token.outputs.token }}
          tag_name: ${{ needs.tag.outputs.name }}
          name: Plover ${{ needs.tag.outputs.name }}
          files: artifacts/**/*

      - name: Trigger website rebuild
        if: env.WEBSITE_DEPLOY_HOOK_URL != ''
        env:
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$WEBSITE_DEPLOY_HOOK_URL" -o /dev/null

  notify_failure:
    name: Notify on failure
    if: failure()
    needs: [tag, build, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report failure to tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          title="Release pipeline broken"
          body="Release run failed for tag \`${TAG:-unknown}\`. See ${RUN_URL}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-broken --json number --jq '.[0].number' || echo "")
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label release-broken || \
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
