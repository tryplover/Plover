name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  release:
    name: Build & Release Desktop Binary
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package App
        run: pnpm package
        env:
          # Disable automatic code signing since we do not have Apple Developer Certificates configured in CI secrets yet
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=v$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            app/dist/*.dmg
            app/dist/*.dmg.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
