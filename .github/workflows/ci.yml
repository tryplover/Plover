name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (with coverage)
        if: github.event_name == 'pull_request'
        run: pnpm test:coverage

      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm test

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: extension/coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build and version
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: v
        run: |
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$last" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "$last"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: pnpm --filter ./extension exec npm pkg set version="$VERSION"

      - name: Build zip
        env:
          WXT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WXT_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID || secrets.WXT_GOOGLE_CLIENT_ID }}
          WXT_PLOVER_BACKEND_URL: ${{ vars.WXT_PLOVER_BACKEND_URL || secrets.WXT_PLOVER_BACKEND_URL }}
        run: pnpm --filter ./extension run zip

      - name: Find zip
        id: build
        run: |
          shopt -s nullglob
          zips=(extension/.output/*-chrome.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one chrome zip in extension/.output, found ${#zips[@]}"
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Plover ${{ steps.v.outputs.tag }}
          files: ${{ steps.build.outputs.zip }}
          prerelease: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
